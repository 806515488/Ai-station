# 独立的 RabbitMQ 基础环境；正式 Celery 应用在工作站项目中接入。
# 服务器目录：/srv/station/celery-infra。真实口令只放该目录的私有 .env。
name: station-tasks

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?set a verified RabbitMQ image digest in .env}
    container_name: station-rabbitmq
    hostname: station-rabbitmq
    restart: unless-stopped
    env_file: .env
    ports:
      # AMQP 与管理页面按用户要求允许外部访问，均保留账号密码认证。
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  rabbitmq-data:
