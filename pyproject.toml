[project]
name = "station-ai"
version = "0.3.0"
description = "个人 AI 工作站（宿主 + skills）：通用 agent 运行时 + 技能注册表 + 异步任务 + 文件/预览 + 单用户 Web。内建技能：档案整理(archive, LangGraph pipeline) / 写周报(agent)。"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # —— Web / API ——
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2",
    # —— 模型接入（langchain 仅作三家 OpenAI 兼容端点的传输层；harness 是宿主的）——
    "langchain>=1",
    "langgraph>=1",
    "langchain-openai>=1",
    # —— 图像 / 4件套导出（archive skill）——
    "pillow>=9",
    # img2pdf：原件 PDF 的**主路径**（JPEG 原样嵌入、零重压缩），不是可选加速。
    # 缺它就只能走 PIL 兜底，而兜底那次把全卷一次性解码 —— 实测 120 页峰值
    # 1411MB vs 552MB（09-13）。1.9G 小机器上这就是"出得来"和"被 OOM 杀掉"的差别。
    "img2pdf>=0.5",
    "openpyxl>=3",
    "reportlab>=3.6",
    "pypdf>=3",
    "requests>=2.25",
    "httpx>=0.27",  # System One: async cancellation enforces the total request budget
    # PostgreSQL 生产驱动。SQLite 仍由 Python 标准库支持，用于本地离线测试与
    # 一次性迁移的源库；运行时设置 STATION_DATABASE_URL 后才会实际连接 PG。
    "psycopg[binary]>=3.2,<4",
    # —— MCP 客户端（09-16 起是**主依赖**，不再是"预留"）——
    # 宿主把外部 MCP server 的工具接进对话（station/mcp/），内置的 websearch 本身
    # 也是一个 stdio MCP server —— 少了这个包，整个 MCP 那一层都不存在。
    # ★ 它原来挂在 [project.optional-dependencies] 里，而 Dockerfile 只跑
    #   `pip install -e .`（不带 extras）→ **镜像里根本装不上**，上线就是 ImportError。
    # ★★ **上界 `<2` 是必须的（09-16 上线时真炸了）**：mcp 2.x 把 `FastMCP` 改名成
    #   `MCPServer`（`mcp.server.fastmcp` 整个没了）、其他 API 也变了。写 `>=1.0`
    #   的话，任何人全新安装都会拿到 2.x，然后内置的 websearch server 一启动就
    #   `ModuleNotFoundError`（本机恰好是 1.27，所以**本地测试全绿、上线才炸**）。
    #   包自己在报错里给的出路就是 pin `mcp<2`。要升 2.x 是一次**迁移**，不是改个号：
    #   得先把 servers/websearch.py 的 FastMCP 换成 MCPServer，再逐个核对
    #   client.py 用到的 client/会话 API 有没有变。见 docs/status.md 的待办。
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]        # weekly-report 的 export_docx
dev = ["pytest>=8"] # 跑离线测试（httpx 已是主依赖）
[project.scripts]
station-web = "station.app.server:main"   # 一键起站：pip install -e .[dev]; station-web
archive-cli = "station.skills.cli:archive_main"  # 保留命令名，具体实现随技能加载
station-migrate-postgres = "station.migrate:main"  # SQLite 元数据一次性导入 PostgreSQL
station-upgrade-postgres = "station.upgrade:main"  # 显式升级既有 PostgreSQL schema

[tool.setuptools.packages.find]
where = ["src", "skills/archive/code"]
include = ["station*", "archive_core*"]

[tool.setuptools.package-data]
"station" = ["app/static/*"]

# wheel 中代码按 Python 包安装，技能入口与可编辑资源按原目录层级一起携带。
# 源码、Docker 仍使用仓库 skills；独立安装使用 sys.prefix/share/station/skills。
[tool.setuptools.data-files]
"share/station/skills/archive" = ["skills/archive/*.json", "skills/archive/*.md"]
"share/station/skills/archive/code" = ["skills/archive/code/*.py"]
"share/station/skills/archive/prompts" = ["skills/archive/prompts/*.md"]
"share/station/skills/archive/口径" = ["skills/archive/口径/*.md"]
"share/station/skills/video" = ["skills/video/*.json", "skills/video/*.md"]
"share/station/skills/video/code" = ["skills/video/code/*.py"]
"share/station/skills/video/prompts" = ["skills/video/prompts/*.md"]
"share/station/skills/interview-coach" = ["skills/interview-coach/*.json", "skills/interview-coach/*.md"]
"share/station/skills/interview-coach/code" = ["skills/interview-coach/code/*.py"]
"share/station/skills/interview-coach/prompts" = ["skills/interview-coach/prompts/*.md"]
"share/station/skills/weekly-report" = ["skills/weekly-report/*.json", "skills/weekly-report/*.md"]
"share/station/skills/weekly-report/code" = ["skills/weekly-report/code/*.py"]
"share/station/skills/demo-agent" = ["skills/demo-agent/*.json", "skills/demo-agent/*.md"]
"share/station/skills/demo-pipe" = ["skills/demo-pipe/*.json", "skills/demo-pipe/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
