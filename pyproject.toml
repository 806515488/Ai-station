[project]
name = "station-ai"
version = "0.3.0"
description = "个人 AI 工作站（宿主 + skills）：通用 agent 运行时 + 技能注册表 + 异步任务 + 文件/预览 + 单用户 Web。内建技能：档案整理(archive, LangGraph pipeline) / 写周报(agent)。"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # —— Web / API ——
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2",
    # —— 模型接入（langchain 仅作三家 OpenAI 兼容端点的传输层；harness 是宿主的）——
    "langchain>=1",
    "langgraph>=1",
    "langchain-openai>=1",
    # —— 图像 / 4件套导出（archive skill）——
    "pillow>=9",
    # img2pdf：原件 PDF 的**主路径**（JPEG 原样嵌入、零重压缩），不是可选加速。
    # 缺它就只能走 PIL 兜底，而兜底那次把全卷一次性解码 —— 实测 120 页峰值
    # 1411MB vs 552MB（09-13）。1.9G 小机器上这就是"出得来"和"被 OOM 杀掉"的差别。
    "img2pdf>=0.5",
    "openpyxl>=3",
    "reportlab>=3.6",
    "pypdf>=3",
    "requests>=2.25",
    # —— MCP 客户端（09-16 起是**主依赖**，不再是"预留"）——
    # 宿主把外部 MCP server 的工具接进对话（station/mcp/），内置的 websearch 本身
    # 也是一个 stdio MCP server —— 少了这个包，整个 MCP 那一层都不存在。
    # ★ 它原来挂在 [project.optional-dependencies] 里，而 Dockerfile 只跑
    #   `pip install -e .`（不带 extras）→ **镜像里根本装不上**，上线就是 ImportError。
    # ★★ **上界 `<2` 是必须的（09-16 上线时真炸了）**：mcp 2.x 把 `FastMCP` 改名成
    #   `MCPServer`（`mcp.server.fastmcp` 整个没了）、其他 API 也变了。写 `>=1.0`
    #   的话，任何人全新安装都会拿到 2.x，然后内置的 websearch server 一启动就
    #   `ModuleNotFoundError`（本机恰好是 1.27，所以**本地测试全绿、上线才炸**）。
    #   包自己在报错里给的出路就是 pin `mcp<2`。要升 2.x 是一次**迁移**，不是改个号：
    #   得先把 servers/websearch.py 的 FastMCP 换成 MCPServer，再逐个核对
    #   client.py 用到的 client/会话 API 有没有变。见 docs/status.md 的待办。
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]        # weekly-report 的 export_docx
dev = ["pytest>=8", "httpx>=0.27"] # 跑离线测试

[project.scripts]
station-web = "station.app.server:main"   # 一键起站：pip install -e .[dev]; station-web
archive-cli = "archive.engine.run:main"   # archive 引擎 CLI（无 Web，调试用）

[tool.setuptools.packages.find]
where = ["src"]
include = ["station*", "archive*"]

[tool.setuptools.package-data]
"station" = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
