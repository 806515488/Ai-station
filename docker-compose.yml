# 服务器上的部署描述：一条 `docker compose up -d --build` 起站。
#
# ★ 本文件是**给服务器看的**，本机开发用不到（本机直接 `station-web` 跑 127.0.0.1:8001，
#   默认值见 src/station/app/server.py 的 _serve_options）。
#
# 服务器上的目录约定（部署脚本会建好）：
#   /srv/station/data     ← 所有运行时状态（SQLite + 上传的照片 + 产物）
#   /srv/station/certs    ← 自签证书 key.pem / cert.pem
# 源码放哪都行，只要在这里 `docker compose up`（一般是 /srv/station/src）。
services:
  station:
    build:
      context: .
      args:
        # 大陆的机器从 pypi.org 装 langchain 这一大家子会慢到离谱；走国内的 PyPI 镜像最快。
        # ★ 09-… 在这台阿里云上实测（`pip download pillow`）：阿里云公网源 83s、
        #   清华 4.5s、腾讯 4.5s、中科大 4.1s —— 阿里云那个**慢 20 倍**，别用。
        # 不想要就删掉这两行（Dockerfile 会回落到默认 PyPI）。
        PIP_INDEX: "https://pypi.tuna.tsinghua.edu.cn/simple"
    image: station-ai:latest
    container_name: station
    restart: unless-stopped

    # 应用要连 PG：等它健康再起，免得"容器起来了、第一次碰数据库就报错"。
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8443:8443"

    # ★★ 模型 API key 从同目录的 `.env` 注入容器（key 放环境变量、不进代码/不进镜像的标准做法）。
    #   这个文件被 .gitignore 挡住，不入库；也被 .dockerignore 挡住，不烤进镜像。
    #   没有这一项，容器里**一个 key 都没有** —— 通用/识图/语音/视频全调不动，
    #   只能由站长进界面 ⚙「模型配置」手动填（那样就只有那一个账号能用）。
    env_file:
      - .env

    environment:
      # ★ 容器里**必须**绑 0.0.0.0。绑 127.0.0.1 的话只有容器自己连得上，
      #   外面（包括端口映射）一律连不进来 —— 这是新手最容易卡半天的一条。
      STATION_HOST: "0.0.0.0"
      STATION_PORT: "8443"
      # 两个都给才开 HTTPS；只给一个会以 HTTP 起站并在日志里告警（见 _serve_options）
      STATION_SSL_KEYFILE: "/certs/key.pem"
      STATION_SSL_CERTFILE: "/certs/cert.pem"
      # ★ 本机**对外**的地址 —— 外部服务要靠它来抓我们托管的东西（视频生成的人像参考图）。
      #   服务器自己不知道自己在外面叫什么：容器里绑的是 0.0.0.0，拿它拼出来的 URL
      #   对端一辈子也抓不到。**不配这一项 = 人像参考图功能不可用**（会明确拒绝，
      #   不是静默失败，见 config.public_base_hint）。
      # ★★ 值刻意**不写死在这里**：它跟着部署环境走，而这个文件会进公开仓库 ——
      #   把真实主机名写进去就等于公开告诉别人你的服务器在哪。
      #   部署时在**同一个目录**放一个 `.env`（已被 .gitignore 挡住，不入库）写：
      #       STATION_PUBLIC_BASE=https://你的域名或公网IP:8443
      #   docker compose 会自动读它做这里的变量替换。没配就是空串。
      STATION_PUBLIC_BASE: "${STATION_PUBLIC_BASE:-}"
      # ★ 数据库连接串。**留空 = 回落本地 SQLite**（本机开发就是这样）；
      #   生产填 postgresql://station:<口令>@postgres:5432/station —— 主机名用
      #   compose 网络里的服务名 `postgres`，**不需要**走公网那条路。
      # ★★ 口令里的 `@` 必须写成 `%40`：连接串里 `@` 是"用户信息/主机"的分隔符，
      #   不编码的话 libpq 会把口令从 `@` 处截断，报"认证失败"。
      # ★ 真值放同目录 .env（不入库）——它含口令，且随部署环境变。
      STATION_DATABASE_URL: "${STATION_DATABASE_URL:-}"

    volumes:
      # ★★ 唯一会丢用户数据的地方 ★★
      # data/ 装着 SQLite、上传的翻拍照片、导出的产物。不挂这个卷，容器一删
      # （compose down / 重新 build）档案就全没了 —— 而且是静默的：容器照常起来，
      # 只是里面是空的。这一行是这个文件里最重要的一行。
      - /srv/station/data:/app/data
      # 证书只读挂进去（容器没有理由写它）
      - /srv/station/certs:/certs:ro

    # cgroup 硬上限（宿主机 3.5G，留出系统 + dockerd 的余量）。
    # 有它：超了死的是这个容器，`docker inspect` 一眼看得出是 OOM，服务重启即可。
    # 没它：内核在**宿主机**上随机挑一个受害者 —— 可能挑到 sshd，那你就连不上机器了。
    # 接入 Celery 时用 deploy/celery.compose.yaml 覆盖本文件，按 Web/Worker 分配容量。
    mem_limit: 2600m

  # ── PostgreSQL ───────────────────────────────────────────────────
  # 应用连它走 compose 网络内的服务名 `postgres:5432`（不出机器，也不需要外网）。
  # 对外映射 5432 只是给"本机用 Navicat/DBeaver 连过去看"用的。
  # ★★ **必须**在云安全组把源 IP 限死成自己的出口 IP，**绝不要开 0.0.0.0/0**：
  #    公网对 5432 的扫描是全天候的，而这台机器**没有主机防火墙**（ufw inactive），
  #    安全组是唯一的墙。
  postgres:
    image: postgres:17-alpine
    container_name: station-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: station
      POSTGRES_USER: station
      # ★ 密码不写死在这里（本文件会进公开仓库），走同目录 .env 的 PG_PASSWORD。
      #   ":?" = 没配就直接报错退出，而不是悄悄用个空密码起来。
      POSTGRES_PASSWORD: "${PG_PASSWORD:?PG_PASSWORD 未配置，见 .env}"

    ports:
      - "5432:5432"

    volumes:
      # 数据库文件是**持久状态**，跟 data/ 同级别重要：容器一删没挂卷就全没了
      - /srv/station/pgdata:/var/lib/postgresql/data

    # 宿主机 3.5G（已加 2G swap）：PG 的内存必须收敛。默认 max_connections=100
    # 配合 work_mem 能顶到几百 MB；这里压到 30 条连接、4MB work_mem。
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 900m
