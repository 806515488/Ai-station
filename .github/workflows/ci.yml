name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,docx,documents]"
      - name: Prepare local document resources
        run: python scripts/prepare_document_resources.py --output-dir .document-deps/nltk_data
      - name: Compile check
        run: python -m compileall -q src
      - name: Offline tests
        env:
          STATION_DOCUMENT_NLTK_DATA: ${{ github.workspace }}/.document-deps/nltk_data
        run: pytest -q
